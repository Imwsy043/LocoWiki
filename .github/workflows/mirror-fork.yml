name: Mirror to personal fork

# Gitee 的「仓库镜像管理（Pull）」只支持个人仓库，不支持组织仓库。
# 这里用 GitHub 的 merge-upstream API 把组织仓库快进到个人 fork，
# 再由 Gitee 从 fork 拉取到 locowiki-content。
# 相比 git push，merge-upstream 不需要 PAT 的 workflow 权限，也不传输对象。
#
# 需要 Actions secrets: MIRROR_PUSH_TOKEN = GitHub PAT（repo 权限）
# 可选 Actions variables: FORK_REPO，默认 Lain-Ego0/LocoWiki

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-fork
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from upstream
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          FORK_REPO: ${{ vars.FORK_REPO }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "${MIRROR_PUSH_TOKEN:-}" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "::warning::MIRROR_PUSH_TOKEN is not configured, skip fork mirror"
            exit 0
          fi
          echo "::add-mask::$token"
          repo="${FORK_REPO:-Lain-Ego0/LocoWiki}"
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${token}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}/merge-upstream" \
            -d '{"branch":"main"}')"
          cat "$body"
          echo
          case "$code" in
            200) echo "Synced ${repo} from LocoWiki/LocoWiki" ;;
            409) echo "::warning::${repo} diverged from upstream; manual sync required" ;;
            *) echo "::error::merge-upstream failed with HTTP ${code}"; exit 1 ;;
          esac
